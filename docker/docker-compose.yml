version: '3.9'

services:
  # ============================================================
  # Database - PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: lisa-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lisa_crm
      POSTGRES_USER: lisa_user
      POSTGRES_PASSWORD: lisa_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisa_user -d lisa_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lisa-network

  # ============================================================
  # Cache - Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: lisa-crm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lisa-network

  # ============================================================
  # Backend - NestJS API
  # ============================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: lisa-crm-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://lisa_user:lisa_password@postgres:5432/lisa_crm
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-change-in-production-min-32-chars
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-min-32-chars
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ../backend/src:/app/src:delegated
      - ../backend/prisma:/app/prisma:delegated
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lisa-network
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start:dev"

  # ============================================================
  # Frontend - Next.js
  # ============================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: lisa-crm-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/src:/app/src:delegated
      - ../frontend/public:/app/public:delegated
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - lisa-network

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: lisa-crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lisa-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_node_modules:
    driver: local
  backend_uploads:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  lisa-network:
    driver: bridge
